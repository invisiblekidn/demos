<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollow Moon Tattoo — demo</title>
<meta name="description" content="Tattoo studio website demo with gallery and sketch request form. Made by invisiblekidn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a0a;--bg2:#131111;--card:#181515;--line:#2a2424;--bone:#ece4d6;--muted:#a3988a;--red:#b3261e;--red2:#d8443a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--bone);font-family:'Be Vietnam Pro',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2,h3,.brand{font-family:'Playfair Display',serif;line-height:1.15}
em{font-style:italic;color:var(--red2)}
.demo-bar{background:var(--red);color:#fff;font-size:13px;text-align:center;padding:6px 12px;font-weight:500}
header{position:sticky;top:0;z-index:20;background:rgba(11,10,10,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
.brand{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:.01em}
.brand svg{width:28px;height:28px}
.nav-links{display:flex;gap:26px;font-size:14px;color:var(--muted)}
.nav-links a:hover{color:var(--bone)}
.nav-right{display:flex;gap:12px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:600 12px 'Be Vietnam Pro';padding:6px 11px;cursor:pointer}
.lang button.on{background:var(--bone);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:#fff;font:600 15px 'Be Vietnam Pro';border:0;border-radius:999px;padding:13px 24px;cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--red2);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--bone)}
.btn.ghost:hover{border-color:var(--bone)}
.btn.sm{padding:9px 18px;font-size:14px}
.hero{padding:80px 0 70px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-120px;top:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(179,38,30,.22),transparent 65%)}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;position:relative;z-index:1}
.kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.hero h1{font-size:clamp(42px,6.4vw,78px);font-weight:800}
.hero p{color:var(--muted);font-size:18px;max-width:500px;margin:22px 0 30px}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{position:relative;justify-self:center;width:min(420px,100%);aspect-ratio:1}
.hero-art .ring{position:absolute;inset:0;border:1px solid var(--line);border-radius:50%}
.hero-art .ring.r2{inset:34px;border-style:dashed}
.hero-art svg{position:absolute;inset:60px;width:calc(100% - 120px);height:calc(100% - 120px)}
.tag{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
.tag b{color:var(--red2)}
.tag.t1{left:0;top:16%}.tag.t2{right:0;bottom:14%}
section{padding:84px 0;border-bottom:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.sec-head h2{font-size:clamp(32px,4.6vw,50px)}
.sec-head p{color:var(--muted);max-width:430px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 15px;font:500 14px 'Be Vietnam Pro';cursor:pointer}
.chip.on{background:var(--bone);border-color:var(--bone);color:var(--bg)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.piece{background:var(--card);border:1px solid var(--line);border-radius:16px;aspect-ratio:1;position:relative;overflow:hidden;display:grid;place-items:center;transition:border-color .2s}
.piece:hover{border-color:#4a3f3f}
.piece svg{width:62%;height:62%}
.piece .cap{position:absolute;left:14px;bottom:12px;right:14px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.piece .cap b{color:var(--bone);font-weight:500}
.artists{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.artist{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.artist .ph{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:'Playfair Display';font-size:28px;font-weight:800;margin-bottom:14px;color:var(--bg)}
.artist h3{font-size:24px}
.artist .st{color:var(--red2);font-size:13px;font-weight:600;margin:2px 0 8px}
.artist p{color:var(--muted);font-size:14px}
.process{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s}
.step{border-top:2px solid var(--red);padding-top:18px}
.step:before{counter-increment:s;content:"0" counter(s);font-family:'Playfair Display';font-size:34px;font-weight:800;color:var(--line);display:block;margin-bottom:6px}
.step h3{font-size:21px;margin-bottom:6px}
.step p{color:var(--muted);font-size:14px}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.price{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.price.hl{border-color:var(--red)}
.price h3{font-size:22px}
.price .sz{color:var(--muted);font-size:13px;margin:4px 0 16px}
.price .amt{font-family:'Playfair Display';font-size:32px;font-weight:800}
.price .amt small{font:400 14px 'Be Vietnam Pro';color:var(--muted)}
.price ul{list-style:none;margin-top:16px;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.price li:before{content:"— ";color:var(--red2)}
.req{display:grid;grid-template-columns:.9fr 1.1fr;gap:30px;align-items:start}
.req-side h2{font-size:clamp(32px,4.6vw,50px);margin-bottom:14px}
.req-side p{color:var(--muted);margin-bottom:20px}
.req-side .pts{display:grid;gap:12px}
.req-side .pts div{display:flex;gap:12px;font-size:15px}
.req-side .pts span{color:var(--red2);font-family:'Playfair Display';font-weight:800}
form{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;display:grid;gap:16px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.f input,.f textarea,.f select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--bone);font:inherit}
.f textarea{min-height:90px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--red2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{background:var(--bg2);border:1px solid var(--line);color:var(--bone);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{border-color:var(--red2);background:rgba(179,38,30,.15)}
.drop{border:1px dashed #4a3f3f;border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.ok{text-align:center;padding:30px 10px}
.ok .c{width:64px;height:64px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin:0 auto 16px}
.ok h3{font-size:28px}
.ok p{color:var(--muted);margin-top:8px}
.small{font-size:12px;color:var(--muted);text-align:center}
.faq{display:grid;gap:10px;max-width:820px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary:after{content:"+";color:var(--red2);font-size:20px;line-height:1}
details[open] summary:after{content:"–"}
details p{color:var(--muted);margin-top:10px;font-size:15px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;display:grid;gap:14px}
.cbox span{display:block;color:var(--muted);font-size:13px}
.bigq{border:1px solid var(--line);border-radius:18px;padding:30px;display:flex;flex-direction:column;justify-content:center;gap:16px;background:radial-gradient(400px 200px at 80% 0,rgba(179,38,30,.18),transparent 70%),var(--bg2)}
.bigq h3{font-size:30px}
footer{padding:28px 0;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--red2)}
@media (max-width:900px){
 .hero .wrap,.req,.contact{grid-template-columns:1fr}
 .gallery,.artists,.prices{grid-template-columns:1fr 1fr}
 .process{grid-template-columns:1fr 1fr}
 .nav-links{display:none}
 .hero-art{width:min(320px,100%)}
}
@media (max-width:600px){
 .gallery{grid-template-columns:1fr 1fr;gap:10px}
 .artists,.prices,.process{grid-template-columns:1fr}
 .row2{grid-template-columns:1fr}
 section{padding:60px 0}.hero{padding:54px 0}
 .nav-right .btn{display:none}
 form{padding:18px}
 .piece .cap{font-size:11px}
}
</style>
</head>

<section id="artists"><div class="wrap">

<section id="process"><div class="wrap">

</div></section>

<section id="prices"><div class="wrap">
  <div class="sec-head"><h2 data-i="prT"></h2><p data-i="prP"></p></div>

</div></section>

<section id="request"><div class="wrap req">

  </div>
  <form id="form" onsubmit="return false"></form>
</div></section>

<section id="faq"><div class="wrap">
  <div class="sec-head"><h2>FAQ</h2></div>
  <div class="faq" id="faqList"></div>
</div></section>

<section id="contacts"><div class="wrap">
  <div class="contact">
    <div class="cbox">
      <div><span data-i="adL"></span><b data-i="ad"></b></div>
      <div><span data-i="hrL"></span><b data-i="hr"></b></div>

  </div>
</div></section>

<footer><div class="wrap"><span>© Hollow Moon Tattoo — <span data-i="foot"></span></span><span data-i="made" data-html></span></div></footer>

const AC=['#e8c9b8','#9fb3c8','#d8443a'];
let L=new URLSearchParams(location.search).get('lang')==='vi'?'vi':'en';
let filter='all',sent=false;const fs={place:0,size:0,style:0};
function svg(k){return `<svg viewBox="0 0 200 200" fill="none" stroke="#ece4d6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ART[k]}</svg>`}
function render(){
  const t=T[L];document.documentElement.lang=L;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=t[e.dataset.i];if(v==null)return;e.hasAttribute('data-html')?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
  document.getElementById('filters').innerHTML=Object.entries(t.f).map(([k,v])=>`<button class="chip ${filter===k?'on':''}" data-f="${k}">${v}</button>`).join('');
  document.getElementById('gallery').innerHTML=PIECES.filter(p=>filter==='all'||p[1]===filter).map(p=>`<div class="piece">${svg(p[0])}<div class="cap"><b>${t.names[p[0]]}</b><span>${t.f[p[1]]}</span></div></div>`).join('');
  document.getElementById('artistList').innerHTML=t.arts.map((a,i)=>`<div class="artist"><div class="ph" style="background:${AC[i]}">${a[0][0]}</div><h3>${a[0]}</h3><div class="st">${a[1]}</div><p>${a[2]}</p></div>`).join('');
  document.getElementById('procList').innerHTML=t.proc.map(p=>`<div class="step"><h3>${p[0]}</h3><p>${p[1]}</p></div>`).join('');
  document.getElementById('priceList').innerHTML=t.pr.map((p,i)=>`<div class="price ${i===1?'hl':''}"><h3>${p[0]}</h3><div class="sz">${p[1]}</div><div class="amt"><small>${t.from} </small>${p[2]}</div><ul>${p[3].split('|').map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
  document.getElementById('faqList').innerHTML=t.faq.map((f,i)=>`<details ${i===0?'open':''}><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('');
  form();
}
function seg(name,arr){return `<div class="seg">${arr.map((x,i)=>`<button type="button" class="${fs[name]===i?'on':''}" data-seg="${name}" data-v="${i}">${x}</button>`).join('')}</div>`}
function form(){
  const t=T[L],fi=t.fi,f=document.getElementById('form');
  if(sent){f.innerHTML=`<div class="ok"><div class="c"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg></div><h3>${t.okT}</h3><p>${t.okP}</p><br><button type="button" class="btn ghost" data-act="again">${t.again}</button></div>`;return}
  f.innerHTML=`<div class="f"><label>${fi.idea}</label><textarea placeholder="${fi.ideaP}"></textarea></div>
  <div class="f"><label>${fi.place}</label>${seg('place',t.places)}</div>
  <div class="row2"><div class="f"><label>${fi.size}</label>${seg('size',t.sizes)}</div><div class="f"><label>${fi.style}</label>${seg('style',t.styles)}</div></div>
  <div class="f"><label>${fi.ref}</label><div class="drop">${fi.refP}</div></div>
  <div class="row2"><div class="f"><label>${fi.name}</label><input placeholder="Linh"></div><div class="f"><label>${fi.contact}</label><input placeholder="@username"></div></div>
  <button type="button" class="btn" data-act="send">${fi.send}</button><div class="small">${t.note}</div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.l){L=b.dataset.l;const u=new URL(location);u.searchParams.set('lang',L);history.replaceState(null,'',u);render();return}
  if(b.dataset.f){filter=b.dataset.f;render();return}
  if(b.dataset.seg){fs[b.dataset.seg]=+b.dataset.v;document.querySelectorAll(`[data-seg="${b.dataset.seg}"]`).forEach(x=>x.classList.toggle('on',x===b));return}
  if(b.dataset.act==='send'){sent=true;form()}
  if(b.dataset.act==='again'){sent=false;form()}
});
render();
</script>
